name: Release

# Triggers when a version tag is pushed (e.g. v1.0.0, v1.2.3)
# This also notifies Packagist via webhook to pick up the new version.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-interaction

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
